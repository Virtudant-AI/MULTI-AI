name: multi_ai
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.3+8

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  llamadart: ^0.8.11
  # 12.0.0+ drops file_picker's own explicit Kotlin Gradle Plugin application,
  # which otherwise fails Android Java compilation ("cannot find symbol
  # FilePickerPlugin") under this project's AGP/Kotlin toolchain version.
  file_picker: ^12.0.0
  record: ^7.1.1

  # In-app delta updates. See lib/update_service.dart; releases are packaged by
  # the `vpk` CLI in .github/workflows/release.yml rather than by Inno Setup.
  # This wraps Velopack's Rust core through flutter_rust_bridge, so
  # `flutter build windows` now compiles Rust as part of the build — the build
  # machine needs a toolchain on PATH, which the release workflow installs.
  velopack_flutter: ^0.3.2
  url_launcher: ^6.3.2

  # The Code tab's one-click engine install (`addons/code/code_engine_installer.dart`):
  # sha256 of the downloaded llama.cpp / opencode zips, and unpacking them. Both were
  # already resolved transitively; promoted now that lib/ imports them directly.
  crypto: ^3.0.6
  archive: ^4.0.9

  # Data directory resolution for chat history / settings / the on-device
  # model cache — dart:io's Platform.environment (the prior approach) is
  # empty on Android and silently resolved to an unwritable path. See
  # chat_store.dart's appDataFile().
  path_provider: ^2.1.5

  # device_ram_io.dart's Windows RAM read (GlobalMemoryStatusEx) — already
  # resolved transitively before this, pinned explicitly now that lib/ calls
  # into it directly instead of only depending on it through other packages.
  ffi: ^2.1.0
  webview_windows: ^0.4.0
  webview_flutter: ^4.14.1

  # The running app's own version, read at runtime so
  # android_update_checker.dart can compare it against the latest GitHub
  # release tag without a hand-maintained constant that could drift from
  # this file's `version:` above.
  package_info_plus: ^10.2.2

  # The notebook add-on's local SQLite store (`addons/notebook/memory_store.dart`)
  # — sources, chunk embeddings, notes. Pinned to the 2.x line deliberately,
  # not the current 3.x: 3.x bundles its native library through Dart's
  # native-assets build hooks, whose protocol has moved past the `hooks: ^2.0.2`
  # override below that velopack_flutter's own (older) hook needs — sqlite3
  # 3.7.0's hook fails to even compile against that pinned `hooks` version
  # (missing `HookInputUserDefines.baseUri`). 2.x predates native-assets
  # entirely and gets its native library the old way, via the
  # sqlite3_flutter_libs plugin below — no hooks-protocol conflict, and it
  # works identically on Android and Windows. Revisit both once
  # velopack_flutter ships a release built against the newer hooks protocol
  # (see that override's own comment).
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Lets tests fake path_provider's platform channel instead of hitting real
  # disk — see chat_store_test.dart.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # On Android, which never talks to the Python backend, the on-device roster
  # ships as this build-time asset instead of coming from /api/models — see
  # tool/generate_on_device_roster.dart and model_pool.dart's Android branch
  # of refresh(). Re-run that script after any change under
  # Multi-AI/multi_ai/models/*.pyx; nothing regenerates it automatically.
  assets:
    - assets/on_device_roster.json
    # Requirements files, a settings.yml template, and Python bootstrap
    # scripts for the Add-ons tab's downloadable components (SearXNG,
    # yt-dlp) — see lib/addons/components/component_runtime.dart. Small
    # text files only; the actual Python packages they name are pip-installed
    # on demand, not shipped here.
    - assets/components/

# velopack_flutter 0.3.2 (latest published) pins code_assets ^1.0.0 / hooks
# ^1.0.3, but Flutter >=3.44.0's native-assets build daemon speaks a newer
# protocol only code_assets >=1.1.0 / hooks >=2.0.0 understand — without this
# override, velopack_flutter's build hook crashes with a null-check failure
# parsing the hook config before it even gets to compiling its Rust crate.
# Pinned to hooks 2.0.x rather than the newer 2.1.0: hooks 2.1.0 needs
# meta ^1.19.0, but this Flutter SDK's own flutter_test pins meta to exactly
# 1.18.0 — 2.0.x still needs only meta ^1.16.0, which satisfies both.
# Remove this whole override once velopack_flutter publishes a release built
# against the newer protocol.
dependency_overrides:
  code_assets: ^1.2.1
  hooks: ^2.0.2
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
